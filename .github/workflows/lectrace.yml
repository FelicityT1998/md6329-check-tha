name: Build and deploy the LecTrace lecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: lectrace
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (CPU-only torch, see lectrace/pyproject.toml)
        run: uv sync

      - name: Build
        run: uv run lectrace build --output _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lectrace/_site

      - uses: actions/deploy-pages@v4
        id: deployment